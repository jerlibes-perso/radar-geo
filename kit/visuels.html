<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="theme.css"><style>
#hero{width:1200px;height:630px;background:var(--couchant);position:relative;overflow:hidden;padding:0}
#hero .sun{position:absolute;left:350px;top:250px;width:500px;height:500px;border-radius:50%;background:linear-gradient(180deg,#FFD23F,#FF7A00 60%,#FF2E88);-webkit-mask:repeating-linear-gradient(180deg,#000 0 26px,transparent 26px 36px)}
#hero .grid{position:absolute;left:-200px;right:-200px;bottom:0;height:210px;background:repeating-linear-gradient(90deg,rgba(23,227,255,.55) 0 2px,transparent 2px 80px),repeating-linear-gradient(180deg,rgba(23,227,255,.55) 0 2px,transparent 2px 30px),#0B0618;transform:perspective(300px) rotateX(55deg);transform-origin:bottom}
#hero svg{position:absolute;bottom:170px;left:0}
#hero .t{position:absolute;left:60px;top:46px;right:60px}
#hero .t .hud{font-size:22px}
#hero .t .big{font-family:var(--choc);font-weight:900;color:#fff;font-size:92px;line-height:.95;text-transform:uppercase;text-shadow:6px 6px 0 var(--magenta);margin-top:14px}
#hero .load{position:absolute;left:60px;right:60px;bottom:40px;font-family:var(--choc);letter-spacing:4px;text-transform:uppercase;color:var(--cyan);font-size:18px}
#hero .load b{display:block;height:10px;background:var(--ombre);margin-top:10px}#hero .load b i{display:block;height:100%;width:62%;background:linear-gradient(90deg,var(--cyan),var(--magenta))}
.badge{width:240px;height:240px;display:inline-flex;align-items:center;justify-content:center;flex-direction:column;background:var(--nuit);margin:0}
.badge .hex{width:170px;height:170px;clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);display:flex;align-items:center;justify-content:center;font-family:var(--choc);font-weight:900;font-size:84px;color:var(--nuit)}
.badge .n{font-family:var(--choc);font-weight:900;letter-spacing:3px;text-transform:uppercase;color:#fff;font-size:20px;margin-top:8px}
#carte{width:600px;height:600px;background:var(--nuit);display:flex;align-items:center;justify-content:center}
</style></head><body>

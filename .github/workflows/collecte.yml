name: Collecte quotidienne
# Passage chaque heure : la collecte du jour part au premier passage après 5 h (heure de Paris), puis chaque moteur déjà relevé est ignoré.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Relancer la collecte du jour même si l'heure ne correspond pas"
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: radar
  cancel-in-progress: false
jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collecte
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m radar.collect
          else
            python -m radar.collect --apres 5
          fi
      - name: Archive
        run: |
          git config user.name "Radar GEO Influa"
          git config user.email "radar@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Collecte du $(TZ=Europe/Paris date +%F)"
          git pull --rebase && git push
